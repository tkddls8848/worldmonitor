openapi: 3.1.0
info:
    title: ResearchService API
    version: 1.0.0
servers:
    - url: https://api.worldmonitor.app
paths:
    /api/research/v1/list-arxiv-papers:
        get:
            tags:
                - ResearchService
            summary: ListArxivPapers
            description: ListArxivPapers returns the newest arXiv papers in cs.AI, cs.CL and cs.CR, optionally filtered to one category, sorted by date, up to 100 per request.
            operationId: ListArxivPapers
            parameters:
                - name: page_size
                  in: query
                  description: Maximum items per page (1-100).
                  required: false
                  example: 25
                  schema:
                    type: integer
                    format: int32
                - name: cursor
                  in: query
                  description: |-
                    Cursor for next page.
                     Accepted but currently ignored; no-op until this handler supports the parameter.
                  required: false
                  example: "next-page-token"
                  schema:
                    type: string
                - name: category
                  in: query
                  description: arXiv category filter (e.g., "cs.AI"). Empty returns all tracked categories.
                  required: false
                  example: "cs.AI"
                  schema:
                    type: string
                - name: query
                  in: query
                  description: |-
                    Search query for paper titles and abstracts.
                     Accepted but currently ignored; no-op until this handler supports the parameter.
                  required: false
                  example: "supply chain risk"
                  schema:
                    type: string
                - name: jmespath
                  in: query
                  description: |-
                    Optional JMESPath expression applied server-side to project or reduce the JSON response before it is returned (mirrors the MCP jmespath argument). Invalid expressions, expressions larger than 1024 UTF-8 bytes, or projections that exceed the 256 KB output cap return HTTP 400 with a {_jmespath_error, original_keys} envelope. Grammar and worked examples: https://www.worldmonitor.app/docs/mcp-jmespath.
                  required: false
                  example: "keys(@)"
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            example:
                                "pagination":
                                    "nextCursor": "next-page-token"
                                    "totalCount": 1
                                "papers":
                                    - "authors":
                                        - "example"
                                      "categories":
                                          - "example"
                                      "id": "example-id"
                                      "publishedAt": 1717200000000
                                      "summary": "Example WorldMonitor observation."
                                      "title": "example"
                                      "url": "https://example.com/worldmonitor"
                            schema:
                                $ref: '#/components/schemas/ListArxivPapersResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ValidationError'
                                    - $ref: '#/components/schemas/JmespathProjectionError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/research/v1/list-trending-repos:
        get:
            tags:
                - ResearchService
            summary: ListTrendingRepos
            description: ListTrendingRepos returns daily trending GitHub repositories for Python, JavaScript or TypeScript from OSSInsight, with GitHub search as a fallback.
            operationId: ListTrendingRepos
            parameters:
                - name: page_size
                  in: query
                  description: Maximum items per page (1-100).
                  required: false
                  example: 25
                  schema:
                    type: integer
                    format: int32
                - name: cursor
                  in: query
                  description: Cursor for next page.
                  required: false
                  example: "next-page-token"
                  schema:
                    type: string
                - name: language
                  in: query
                  description: Programming language filter (e.g., "python", "typescript").
                  required: false
                  example: "typescript"
                  schema:
                    type: string
                - name: period
                  in: query
                  description: Trending period (e.g., "daily", "weekly"). Defaults to "daily".
                  required: false
                  example: "daily"
                  schema:
                    type: string
                - name: jmespath
                  in: query
                  description: |-
                    Optional JMESPath expression applied server-side to project or reduce the JSON response before it is returned (mirrors the MCP jmespath argument). Invalid expressions, expressions larger than 1024 UTF-8 bytes, or projections that exceed the 256 KB output cap return HTTP 400 with a {_jmespath_error, original_keys} envelope. Grammar and worked examples: https://www.worldmonitor.app/docs/mcp-jmespath.
                  required: false
                  example: "keys(@)"
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            example:
                                "pagination":
                                    "nextCursor": "next-page-token"
                                    "totalCount": 1
                                "repos":
                                    - "description": "Example WorldMonitor observation."
                                      "forks": 1
                                      "fullName": "koala73/worldmonitor"
                                      "language": "typescript"
                                      "stars": 1
                                      "starsToday": 1
                            schema:
                                $ref: '#/components/schemas/ListTrendingReposResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ValidationError'
                                    - $ref: '#/components/schemas/JmespathProjectionError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/research/v1/list-hackernews-items:
        get:
            tags:
                - ResearchService
            summary: ListHackernewsItems
            description: ListHackernewsItems returns up to 30 Hacker News stories from the top, new, best, ask, show or job feed, read from the official Hacker News Firebase API.
            operationId: ListHackernewsItems
            parameters:
                - name: page_size
                  in: query
                  description: Maximum items per page (1-100).
                  required: false
                  example: 25
                  schema:
                    type: integer
                    format: int32
                - name: cursor
                  in: query
                  description: Cursor for next page.
                  required: false
                  example: "next-page-token"
                  schema:
                    type: string
                - name: feed_type
                  in: query
                  description: 'Feed type: "top", "new", "best", "ask", "show", "job". Defaults to "top".'
                  required: false
                  example: "top"
                  schema:
                    type: string
                    enum:
                        - 'top'
                        - 'new'
                        - 'best'
                        - 'ask'
                        - 'show'
                        - 'job'
                - name: jmespath
                  in: query
                  description: |-
                    Optional JMESPath expression applied server-side to project or reduce the JSON response before it is returned (mirrors the MCP jmespath argument). Invalid expressions, expressions larger than 1024 UTF-8 bytes, or projections that exceed the 256 KB output cap return HTTP 400 with a {_jmespath_error, original_keys} envelope. Grammar and worked examples: https://www.worldmonitor.app/docs/mcp-jmespath.
                  required: false
                  example: "keys(@)"
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            example:
                                "items":
                                    - "by": "example"
                                      "commentCount": 1
                                      "id": 1
                                      "score": 42
                                      "submittedAt": 1717200000000
                                      "title": "example"
                                "pagination":
                                    "nextCursor": "next-page-token"
                                    "totalCount": 1
                            schema:
                                $ref: '#/components/schemas/ListHackernewsItemsResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ValidationError'
                                    - $ref: '#/components/schemas/JmespathProjectionError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
components:
    schemas:
        JmespathProjectionError:
            description: Returned when a REST jmespath projection is invalid or exceeds the expression/output byte limits.
            properties:
                _jmespath_error:
                    description: Projection error discriminator and details.
                    type: string
                original_keys:
                    description: Top-level keys or shape of the unprojected response.
                    items:
                        type: string
                    type: array
            required:
                - _jmespath_error
                - original_keys
            type: object
        Error:
            type: object
            properties:
                message:
                    type: string
                    description: Error message (e.g., 'user not found', 'database connection failed')
            description: Error is returned when a handler encounters an error. It contains a simple error message that the developer can customize.
        FieldViolation:
            type: object
            properties:
                field:
                    type: string
                    description: The field path that failed validation (e.g., 'user.email' for nested fields). For header validation, this will be the header name (e.g., 'X-API-Key')
                description:
                    type: string
                    description: Human-readable description of the validation violation (e.g., 'must be a valid email address', 'required field missing')
            required:
                - field
                - description
            description: FieldViolation describes a single validation error for a specific field.
        ValidationError:
            type: object
            properties:
                violations:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldViolation'
                    description: List of validation violations
            required:
                - violations
            description: ValidationError is returned when request validation fails. It contains a list of field violations describing what went wrong.
        ListArxivPapersRequest:
            type: object
            properties:
                pageSize:
                    type: integer
                    format: int32
                    description: Maximum items per page (1-100).
                cursor:
                    type: string
                    description: |-
                        Cursor for next page.
                         Accepted but currently ignored; no-op until this handler supports the parameter.
                category:
                    type: string
                    description: arXiv category filter (e.g., "cs.AI"). Empty returns all tracked categories.
                query:
                    type: string
                    description: |-
                        Search query for paper titles and abstracts.
                         Accepted but currently ignored; no-op until this handler supports the parameter.
            description: ListArxivPapersRequest specifies filters for retrieving arXiv papers.
        ListArxivPapersResponse:
            type: object
            properties:
                papers:
                    type: array
                    items:
                        $ref: '#/components/schemas/ArxivPaper'
                pagination:
                    $ref: '#/components/schemas/PaginationResponse'
            description: ListArxivPapersResponse contains arXiv papers matching the request.
        ArxivPaper:
            type: object
            properties:
                id:
                    type: string
                    minLength: 1
                    description: arXiv paper ID (e.g., "2401.12345").
                title:
                    type: string
                    minLength: 1
                    description: Paper title.
                summary:
                    type: string
                    description: Paper abstract (may be truncated).
                authors:
                    type: array
                    items:
                        type: string
                        description: Author names.
                categories:
                    type: array
                    items:
                        type: string
                        description: arXiv categories (e.g., "cs.AI", "cs.LG").
                publishedAt:
                    type: integer
                    format: int64
                    description: 'Publication time, as Unix epoch milliseconds.. Warning: Values > 2^53 may lose precision in JavaScript'
                url:
                    type: string
                    description: URL to the paper.
            required:
                - id
                - title
            description: ArxivPaper represents a research paper from arXiv.
        PaginationResponse:
            type: object
            properties:
                nextCursor:
                    type: string
                    description: Cursor for fetching the next page. Empty string indicates no more pages.
                totalCount:
                    type: integer
                    format: int32
                    description: Total count of items matching the query, if known. Zero if the total is unknown.
            description: PaginationResponse contains pagination metadata returned alongside list results.
        ListTrendingReposRequest:
            type: object
            properties:
                pageSize:
                    type: integer
                    format: int32
                    description: Maximum items per page (1-100).
                cursor:
                    type: string
                    description: Cursor for next page.
                language:
                    type: string
                    description: Programming language filter (e.g., "python", "typescript").
                period:
                    type: string
                    description: Trending period (e.g., "daily", "weekly"). Defaults to "daily".
            description: ListTrendingReposRequest specifies filters for retrieving trending GitHub repos.
        ListTrendingReposResponse:
            type: object
            properties:
                repos:
                    type: array
                    items:
                        $ref: '#/components/schemas/GithubRepo'
                pagination:
                    $ref: '#/components/schemas/PaginationResponse'
            description: ListTrendingReposResponse contains trending GitHub repositories.
        GithubRepo:
            type: object
            properties:
                fullName:
                    type: string
                    minLength: 1
                    description: Repository full name (e.g., "owner/repo").
                description:
                    type: string
                    description: Repository description.
                language:
                    type: string
                    description: Primary programming language.
                stars:
                    type: integer
                    minimum: 0
                    format: int32
                    description: Total star count.
                starsToday:
                    type: integer
                    format: int32
                    description: Stars gained in the trending period.
                forks:
                    type: integer
                    format: int32
                    description: Number of open forks.
                url:
                    type: string
                    description: Repository URL.
            required:
                - fullName
            description: GithubRepo represents a trending repository from GitHub.
        ListHackernewsItemsRequest:
            type: object
            properties:
                pageSize:
                    type: integer
                    format: int32
                    description: Maximum items per page (1-100).
                cursor:
                    type: string
                    description: Cursor for next page.
                feedType:
                    type: string
                    description: 'Feed type: "top", "new", "best", "ask", "show", "job". Defaults to "top".'
            description: ListHackernewsItemsRequest specifies filters for retrieving Hacker News items.
        ListHackernewsItemsResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/HackernewsItem'
                pagination:
                    $ref: '#/components/schemas/PaginationResponse'
            description: ListHackernewsItemsResponse contains Hacker News items.
        HackernewsItem:
            type: object
            properties:
                id:
                    type: integer
                    format: int32
                    description: HN item ID.
                title:
                    type: string
                    minLength: 1
                    description: Item title.
                url:
                    type: string
                    description: URL (empty for Ask HN / Show HN text posts).
                score:
                    type: integer
                    minimum: 0
                    format: int32
                    description: Upvote score.
                commentCount:
                    type: integer
                    format: int32
                    description: Number of comments.
                by:
                    type: string
                    description: Author username.
                submittedAt:
                    type: integer
                    format: int64
                    description: 'Submission time, as Unix epoch milliseconds.. Warning: Values > 2^53 may lose precision in JavaScript'
            required:
                - title
            description: HackernewsItem represents an item from Hacker News.
