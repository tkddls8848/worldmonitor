openapi: 3.1.0
info:
    title: ClimateService API
    version: 1.0.0
servers:
    - url: https://api.worldmonitor.app
paths:
    /api/climate/v1/list-climate-anomalies:
        get:
            tags:
                - ClimateService
            summary: ListClimateAnomalies
            description: ListClimateAnomalies returns 7-day temperature and precipitation departures from 1991-2020 monthly normals per climate zone, using Open-Meteo ERA5 data.
            operationId: ListClimateAnomalies
            parameters:
                - name: page_size
                  in: query
                  description: |-
                    Maximum items per page (1-100).
                     Accepted but currently ignored; no-op until this handler supports the parameter.
                  required: false
                  example: 25
                  schema:
                    type: integer
                    format: int32
                - name: cursor
                  in: query
                  description: |-
                    Cursor for next page.
                     Accepted but currently ignored; no-op until this handler supports the parameter.
                  required: false
                  example: "next-page-token"
                  schema:
                    type: string
                - name: min_severity
                  in: query
                  description: |-
                    Optional filter by anomaly severity.
                     Accepted but currently ignored; no-op until this handler supports the parameter.
                  required: false
                  example: "ANOMALY_SEVERITY_NORMAL"
                  schema:
                    type: string
                    enum:
                        - 'ANOMALY_SEVERITY_NORMAL'
                        - 'ANOMALY_SEVERITY_MODERATE'
                        - 'ANOMALY_SEVERITY_EXTREME'
                - name: jmespath
                  in: query
                  description: |-
                    Optional JMESPath expression applied server-side to project or reduce the JSON response before it is returned (mirrors the MCP jmespath argument). Invalid expressions, expressions larger than 1024 UTF-8 bytes, or projections that exceed the 256 KB output cap return HTTP 400 with a {_jmespath_error, original_keys} envelope. Grammar and worked examples: https://www.worldmonitor.app/docs/mcp-jmespath.
                  required: false
                  example: "keys(@)"
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            example:
                                "anomalies":
                                    - "location":
                                        "latitude": 40.7128
                                        "longitude": -74.006
                                      "period": "daily"
                                      "precipDelta": 1.5
                                      "severity": "ANOMALY_SEVERITY_NORMAL"
                                      "tempDelta": 1.5
                                      "type": "ANOMALY_TYPE_WARM"
                                      "zone": "example"
                                "pagination":
                                    "nextCursor": "next-page-token"
                                    "totalCount": 1
                            schema:
                                $ref: '#/components/schemas/ListClimateAnomaliesResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ValidationError'
                                    - $ref: '#/components/schemas/JmespathProjectionError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/climate/v1/list-climate-disasters:
        get:
            tags:
                - ClimateService
            summary: ListClimateDisasters
            description: ListClimateDisasters returns recent floods, cyclones, droughts, heatwaves, wildfires and volcanoes from ReliefWeb, GDACS, EONET and FIRMS, up to 100 per page.
            operationId: ListClimateDisasters
            parameters:
                - name: page_size
                  in: query
                  description: Maximum items per page (1-100).
                  required: false
                  example: 25
                  schema:
                    type: integer
                    format: int32
                - name: cursor
                  in: query
                  description: Cursor for next page.
                  required: false
                  example: "next-page-token"
                  schema:
                    type: string
                - name: jmespath
                  in: query
                  description: |-
                    Optional JMESPath expression applied server-side to project or reduce the JSON response before it is returned (mirrors the MCP jmespath argument). Invalid expressions, expressions larger than 1024 UTF-8 bytes, or projections that exceed the 256 KB output cap return HTTP 400 with a {_jmespath_error, original_keys} envelope. Grammar and worked examples: https://www.worldmonitor.app/docs/mcp-jmespath.
                  required: false
                  example: "keys(@)"
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            example:
                                "disasters":
                                    - "affectedPopulation": 1
                                      "country": "US"
                                      "countryCode": "US"
                                      "id": "example-id"
                                      "lat": 40.7128
                                "pagination":
                                    "nextCursor": "next-page-token"
                                    "totalCount": 1
                            schema:
                                $ref: '#/components/schemas/ListClimateDisastersResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ValidationError'
                                    - $ref: '#/components/schemas/JmespathProjectionError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/climate/v1/get-co2-monitoring:
        get:
            tags:
                - ClimateService
            summary: GetCo2Monitoring
            description: GetCo2Monitoring returns NOAA GML Mauna Loa CO2 readings (current, year-ago, 12-month trend) with global methane and nitrous oxide levels, refreshed every 3 days.
            operationId: GetCo2Monitoring
            parameters:
                - name: jmespath
                  in: query
                  description: |-
                    Optional JMESPath expression applied server-side to project or reduce the JSON response before it is returned (mirrors the MCP jmespath argument). Invalid expressions, expressions larger than 1024 UTF-8 bytes, or projections that exceed the 256 KB output cap return HTTP 400 with a {_jmespath_error, original_keys} envelope. Grammar and worked examples: https://www.worldmonitor.app/docs/mcp-jmespath.
                  required: false
                  example: "keys(@)"
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            example:
                                "monitoring":
                                    "annualGrowthRate": 75.25
                                    "currentPpm": 1.5
                                    "measuredAt": "1717200000000"
                                    "methanePpb": 1.5
                                    "monthlyAverage": 1.5
                            schema:
                                $ref: '#/components/schemas/GetCo2MonitoringResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ValidationError'
                                    - $ref: '#/components/schemas/JmespathProjectionError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/climate/v1/get-ocean-ice-data:
        get:
            tags:
                - ClimateService
            summary: GetOceanIceData
            description: GetOceanIceData returns NSIDC Arctic sea ice extent and anomaly with a 12-month trend, NASA sea level rise, NOAA 0-700m ocean heat content and SST anomaly.
            operationId: GetOceanIceData
            parameters:
                - name: jmespath
                  in: query
                  description: |-
                    Optional JMESPath expression applied server-side to project or reduce the JSON response before it is returned (mirrors the MCP jmespath argument). Invalid expressions, expressions larger than 1024 UTF-8 bytes, or projections that exceed the 256 KB output cap return HTTP 400 with a {_jmespath_error, original_keys} envelope. Grammar and worked examples: https://www.worldmonitor.app/docs/mcp-jmespath.
                  required: false
                  example: "keys(@)"
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            example:
                                "data":
                                    "arcticExtentAnomalyMkm2": 1.5
                                    "arcticExtentMkm2": 1.5
                                    "arcticTrend": "example"
                                    "iceTrend12m":
                                        - "anomalyMkm2": 1.5
                                          "extentMkm2": 1.5
                                          "month": "example"
                                    "measuredAt": 1717200000000
                            schema:
                                $ref: '#/components/schemas/GetOceanIceDataResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ValidationError'
                                    - $ref: '#/components/schemas/JmespathProjectionError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/climate/v1/list-reservoir-levels:
        get:
            tags:
                - ClimateService
            summary: ListReservoirLevels
            description: ListReservoirLevels returns ICESat-2 lidar levels and level changes for strategic reservoirs and lakes. Passes typically publish 50 to 70 days after overpass; see latest.ageDays.
            operationId: ListReservoirLevels
            parameters:
                - name: jmespath
                  in: query
                  description: |-
                    Optional JMESPath expression applied server-side to project or reduce the JSON response before it is returned (mirrors the MCP jmespath argument). Invalid expressions, expressions larger than 1024 UTF-8 bytes, or projections that exceed the 256 KB output cap return HTTP 400 with a {_jmespath_error, original_keys} envelope. Grammar and worked examples: https://www.worldmonitor.app/docs/mcp-jmespath.
                  required: false
                  example: "keys(@)"
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            example:
                                "dataAvailable": true
                                "fetchedAt": 1790812800000
                                "reservoirs":
                                    - "change90dM": -2.893
                                      "id": "mead"
                                      "lat": 36.13
                                      "latest":
                                          "ageDays": 24
                                          "date": "2026-09-06"
                                          "levelM": 316.757
                                      "lon": -114.45
                                      "name": "Lake Mead"
                                      "status": "record_low"
                                "source":
                                    "name": "NASA ICESat-2 ATL13"
                                    "product": "ATL13 v007"
                            schema:
                                $ref: '#/components/schemas/ListReservoirLevelsResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ValidationError'
                                    - $ref: '#/components/schemas/JmespathProjectionError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/climate/v1/list-climate-news:
        get:
            tags:
                - ClimateService
            summary: ListClimateNews
            description: |-
                ListClimateNews retrieves latest climate/environment intelligence headlines from seeded RSS feeds.
                 Empty items with fetched_at=0 or data_available=false means the seed snapshot
                 is unavailable/degraded, not that there are confirmed zero headlines.
            operationId: ListClimateNews
            parameters:
                - name: jmespath
                  in: query
                  description: |-
                    Optional JMESPath expression applied server-side to project or reduce the JSON response before it is returned (mirrors the MCP jmespath argument). Invalid expressions, expressions larger than 1024 UTF-8 bytes, or projections that exceed the 256 KB output cap return HTTP 400 with a {_jmespath_error, original_keys} envelope. Grammar and worked examples: https://www.worldmonitor.app/docs/mcp-jmespath.
                  required: false
                  example: "keys(@)"
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            example:
                                "dataAvailable": true
                                "fetchedAt": 1717200000000
                                "items":
                                    - "id": "example-id"
                                      "publishedAt": 1717200000000
                                      "sourceName": "WorldMonitor Analyst"
                                      "summary": "Example WorldMonitor observation."
                                      "title": "example"
                            schema:
                                $ref: '#/components/schemas/ListClimateNewsResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ValidationError'
                                    - $ref: '#/components/schemas/JmespathProjectionError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
components:
    schemas:
        JmespathProjectionError:
            description: Returned when a REST jmespath projection is invalid or exceeds the expression/output byte limits.
            properties:
                _jmespath_error:
                    description: Projection error discriminator and details.
                    type: string
                original_keys:
                    description: Top-level keys or shape of the unprojected response.
                    items:
                        type: string
                    type: array
            required:
                - _jmespath_error
                - original_keys
            type: object
        Error:
            type: object
            properties:
                message:
                    type: string
                    description: Error message (e.g., 'user not found', 'database connection failed')
            description: Error is returned when a handler encounters an error. It contains a simple error message that the developer can customize.
        FieldViolation:
            type: object
            properties:
                field:
                    type: string
                    description: The field path that failed validation (e.g., 'user.email' for nested fields). For header validation, this will be the header name (e.g., 'X-API-Key')
                description:
                    type: string
                    description: Human-readable description of the validation violation (e.g., 'must be a valid email address', 'required field missing')
            required:
                - field
                - description
            description: FieldViolation describes a single validation error for a specific field.
        ValidationError:
            type: object
            properties:
                violations:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldViolation'
                    description: List of validation violations
            required:
                - violations
            description: ValidationError is returned when request validation fails. It contains a list of field violations describing what went wrong.
        ListClimateAnomaliesRequest:
            type: object
            properties:
                pageSize:
                    type: integer
                    format: int32
                    description: |-
                        Maximum items per page (1-100).
                         Accepted but currently ignored; no-op until this handler supports the parameter.
                cursor:
                    type: string
                    description: |-
                        Cursor for next page.
                         Accepted but currently ignored; no-op until this handler supports the parameter.
                minSeverity:
                    type: string
                    enum:
                        - ANOMALY_SEVERITY_UNSPECIFIED
                        - ANOMALY_SEVERITY_NORMAL
                        - ANOMALY_SEVERITY_MODERATE
                        - ANOMALY_SEVERITY_EXTREME
                    description: |-
                        AnomalySeverity represents the severity of a climate anomaly.
                         Maps to existing TS union: 'normal' | 'moderate' | 'extreme'.
            description: ListClimateAnomaliesRequest specifies filters for retrieving climate anomaly data.
        ListClimateAnomaliesResponse:
            type: object
            properties:
                anomalies:
                    type: array
                    items:
                        $ref: '#/components/schemas/ClimateAnomaly'
                pagination:
                    $ref: '#/components/schemas/PaginationResponse'
            description: ListClimateAnomaliesResponse contains the list of climate anomalies.
        ClimateAnomaly:
            type: object
            properties:
                zone:
                    type: string
                    minLength: 1
                    description: Climate zone name (e.g., "Northern Europe", "Sahel").
                location:
                    $ref: '#/components/schemas/GeoCoordinates'
                tempDelta:
                    type: number
                    format: double
                    description: Temperature deviation from normal in degrees Celsius.
                precipDelta:
                    type: number
                    format: double
                    description: Precipitation deviation from normal in millimeters.
                severity:
                    type: string
                    enum:
                        - ANOMALY_SEVERITY_UNSPECIFIED
                        - ANOMALY_SEVERITY_NORMAL
                        - ANOMALY_SEVERITY_MODERATE
                        - ANOMALY_SEVERITY_EXTREME
                    description: |-
                        AnomalySeverity represents the severity of a climate anomaly.
                         Maps to existing TS union: 'normal' | 'moderate' | 'extreme'.
                type:
                    type: string
                    enum:
                        - ANOMALY_TYPE_UNSPECIFIED
                        - ANOMALY_TYPE_WARM
                        - ANOMALY_TYPE_COLD
                        - ANOMALY_TYPE_WET
                        - ANOMALY_TYPE_DRY
                        - ANOMALY_TYPE_MIXED
                    description: |-
                        AnomalyType represents the type of climate anomaly.
                         Maps to existing TS union: 'warm' | 'cold' | 'wet' | 'dry' | 'mixed'.
                period:
                    type: string
                    minLength: 1
                    description: Time period covered (e.g., "2024-W03", "2024-01").
            required:
                - zone
                - period
            description: |-
                ClimateAnomaly represents a temperature or precipitation deviation from historical norms.
                 Sourced from Open-Meteo / ERA5 reanalysis data.
        GeoCoordinates:
            type: object
            properties:
                latitude:
                    type: number
                    maximum: 90
                    minimum: -90
                    format: double
                    description: Latitude in decimal degrees (-90 to 90).
                longitude:
                    type: number
                    maximum: 180
                    minimum: -180
                    format: double
                    description: Longitude in decimal degrees (-180 to 180).
            description: GeoCoordinates represents a geographic location using WGS84 coordinates.
        PaginationResponse:
            type: object
            properties:
                nextCursor:
                    type: string
                    description: Cursor for fetching the next page. Empty string indicates no more pages.
                totalCount:
                    type: integer
                    format: int32
                    description: Total count of items matching the query, if known. Zero if the total is unknown.
            description: PaginationResponse contains pagination metadata returned alongside list results.
        ListClimateDisastersRequest:
            type: object
            properties:
                pageSize:
                    type: integer
                    format: int32
                    description: Maximum items per page (1-100).
                cursor:
                    type: string
                    description: Cursor for next page.
            description: ListClimateDisastersRequest specifies filters for retrieving climate disasters.
        ListClimateDisastersResponse:
            type: object
            properties:
                disasters:
                    type: array
                    items:
                        $ref: '#/components/schemas/ClimateDisaster'
                pagination:
                    $ref: '#/components/schemas/PaginationResponse'
            description: ListClimateDisastersResponse contains climate disaster events.
        ClimateDisaster:
            type: object
            properties:
                id:
                    type: string
                    description: Unique event identifier.
                type:
                    type: string
                    description: 'Disaster type: flood, cyclone, drought, heatwave, wildfire, volcano.'
                name:
                    type: string
                    description: Human-readable event name.
                country:
                    type: string
                    description: Country name.
                countryCode:
                    type: string
                    description: ISO 3166-1 alpha-2 country code.
                lat:
                    type: number
                    format: double
                    description: Event latitude.
                lng:
                    type: number
                    format: double
                    description: Event longitude.
                severity:
                    type: string
                    description: 'Severity level. GDACS: green/orange/red. ReliefWeb: low/medium/high.'
                startedAt:
                    type: integer
                    format: int64
                    description: 'Event start time as Unix epoch milliseconds. Warning: Values > 2^53 may lose precision in JavaScript'
                status:
                    type: string
                    description: 'Event status: alert/ongoing/past.'
                affectedPopulation:
                    type: integer
                    format: int32
                    description: Affected population when available.
                source:
                    type: string
                    description: 'Source system: GDACS, ReliefWeb, NASA FIRMS, EONET.'
                sourceUrl:
                    type: string
                    description: Source URL for drill-down.
            description: ClimateDisaster represents a climate-relevant disaster event from seeded caches.
        GetCo2MonitoringRequest:
            type: object
        GetCo2MonitoringResponse:
            type: object
            properties:
                monitoring:
                    $ref: '#/components/schemas/Co2Monitoring'
        Co2Monitoring:
            type: object
            properties:
                currentPpm:
                    type: number
                    format: double
                yearAgoPpm:
                    type: number
                    format: double
                annualGrowthRate:
                    type: number
                    format: double
                preIndustrialBaseline:
                    type: number
                    format: double
                monthlyAverage:
                    type: number
                    format: double
                trend12m:
                    type: array
                    items:
                        $ref: '#/components/schemas/Co2DataPoint'
                methanePpb:
                    type: number
                    format: double
                nitrousOxidePpb:
                    type: number
                    format: double
                measuredAt:
                    type: string
                    format: int64
                station:
                    type: string
        Co2DataPoint:
            type: object
            properties:
                month:
                    type: string
                ppm:
                    type: number
                    format: double
                anomaly:
                    type: number
                    format: double
                    description: Year-over-year delta vs same calendar month, in ppm.
        GetOceanIceDataRequest:
            type: object
        GetOceanIceDataResponse:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/OceanIceData'
        OceanIceData:
            type: object
            properties:
                arcticExtentMkm2:
                    type: number
                    format: double
                arcticExtentAnomalyMkm2:
                    type: number
                    format: double
                arcticTrend:
                    type: string
                seaLevelMmAbove1993:
                    type: number
                    format: double
                seaLevelAnnualRiseMm:
                    type: number
                    format: double
                ohc0700mZj:
                    type: number
                    format: double
                sstAnomalyC:
                    type: number
                    format: double
                measuredAt:
                    type: integer
                    format: int64
                    description: 'Warning: Values > 2^53 may lose precision in JavaScript'
                iceTrend12m:
                    type: array
                    items:
                        $ref: '#/components/schemas/IceTrendPoint'
        IceTrendPoint:
            type: object
            properties:
                month:
                    type: string
                extentMkm2:
                    type: number
                    format: double
                anomalyMkm2:
                    type: number
                    format: double
        ListReservoirLevelsRequest:
            type: object
        ListReservoirLevelsResponse:
            type: object
            properties:
                reservoirs:
                    type: array
                    items:
                        $ref: '#/components/schemas/ReservoirLevel'
                fetchedAt:
                    type: integer
                    format: int64
                    description: 'Unix epoch ms; 0 when the snapshot is unavailable.. Warning: Values > 2^53 may lose precision in JavaScript'
                dataAvailable:
                    type: boolean
                source:
                    $ref: '#/components/schemas/ReservoirLevelsSource'
                methodology:
                    type: string
        ReservoirLevel:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                country:
                    type: string
                riparians:
                    type: array
                    items:
                        type: string
                river:
                    type: string
                lat:
                    type: number
                    format: double
                lon:
                    type: number
                    format: double
                tags:
                    type: array
                    items:
                        type: string
                why:
                    type: string
                latest:
                    $ref: '#/components/schemas/ReservoirLatestPass'
                prevDate:
                    type: string
                changePrevM:
                    type: number
                    format: double
                change30dM:
                    type: number
                    format: double
                    description: Changes are interpolated between overpasses, never extrapolated.
                change90dM:
                    type: number
                    format: double
                change365dM:
                    type: number
                    format: double
                seasonalAnomalyM:
                    type: number
                    format: double
                    description: Against the same time of year in at least three prior years.
                seasonalZ:
                    type: number
                    format: double
                recordMinM:
                    type: number
                    format: double
                recordMaxM:
                    type: number
                    format: double
                recordStart:
                    type: string
                percentOfRange:
                    type: number
                    format: double
                recordLow:
                    type: boolean
                recordHigh:
                    type: boolean
                status:
                    type: string
                    description: |-
                        no_recent_data, record_low, record_high, falling_fast, rising_fast,
                         low, high, normal or insufficient_history.
                series:
                    type: array
                    items:
                        $ref: '#/components/schemas/ReservoirLevelPoint'
                okPassCount:
                    type: integer
                    format: int32
            description: |-
                ReservoirLevel is the ICESat-2 water-surface level of one reservoir or
                 lake, metres above the EGM2008 geoid. Not a storage volume.
        ReservoirLatestPass:
            type: object
            properties:
                date:
                    type: string
                levelM:
                    type: number
                    format: double
                madM:
                    type: number
                    format: double
                segmentCount:
                    type: integer
                    format: int32
                ageDays:
                    type: integer
                    format: int32
        ReservoirLevelPoint:
            type: object
            properties:
                date:
                    type: string
                levelM:
                    type: number
                    format: double
        ReservoirLevelsSource:
            type: object
            properties:
                name:
                    type: string
                product:
                    type: string
                url:
                    type: string
                processing:
                    type: string
        ListClimateNewsRequest:
            type: object
        ListClimateNewsResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/ClimateNewsItem'
                fetchedAt:
                    type: integer
                    format: int64
                    description: |-
                        Time the seed snapshot was fetched, as Unix epoch milliseconds. A value of
                         0 means the snapshot is unavailable/degraded, not that there are
                         confirmed zero climate headlines.. Warning: Values > 2^53 may lose precision in JavaScript
                dataAvailable:
                    type: boolean
                    description: |-
                        True when items came from a seed snapshot. False means an empty payload is
                         graceful degradation because the snapshot is unavailable.
        ClimateNewsItem:
            type: object
            properties:
                id:
                    type: string
                    description: Unique identifier (URL hash + publish timestamp).
                title:
                    type: string
                    description: Article headline.
                url:
                    type: string
                    description: Canonical article URL.
                sourceName:
                    type: string
                    description: Source publication name.
                publishedAt:
                    type: integer
                    format: int64
                    description: 'Publication time as Unix epoch milliseconds.. Warning: Values > 2^53 may lose precision in JavaScript'
                summary:
                    type: string
                    description: Short summary/description (max 300 chars in seed pipeline).
            description: ClimateNewsItem represents a single climate/environment news article.
