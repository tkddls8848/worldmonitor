openapi: 3.1.0
info:
    title: SafetyService API
    version: 1.0.0
servers:
    - url: https://api.worldmonitor.app
paths:
    /api/safety/v1/get-toronto-safety:
        get:
            tags:
                - SafetyService
            summary: GetTorontoSafety
            description: Explore one Toronto Police Service dataset with area, offence and year filters, plus source attribution, data semantics and freshness for local safety analysis.
            operationId: GetTorontoSafety
            parameters:
                - name: dataset
                  in: query
                  description: 'Dataset selector. Accepted values: reported_occurrence, annual_aggregate.'
                  required: false
                  example: "reported_occurrence"
                  schema:
                    type: string
                - name: limit
                  in: query
                  description: Maximum rows to return. The service defaults to 50 and caps this value at 100.
                  required: false
                  example: 25
                  schema:
                    type: integer
                    format: int32
                - name: division
                  in: query
                  description: Optional case-insensitive police-division filter.
                  required: false
                  example: "example"
                  schema:
                    type: string
                - name: neighbourhood
                  in: query
                  description: Optional case-insensitive neighbourhood filter.
                  required: false
                  example: "example"
                  schema:
                    type: string
                - name: offence
                  in: query
                  description: Optional case-insensitive offence filter for tps_mci.
                  required: false
                  example: "example"
                  schema:
                    type: string
                - name: year
                  in: query
                  description: Optional event-year filter for tps_calls_attended.
                  required: false
                  example: 1
                  schema:
                    type: integer
                    format: int32
                - name: jmespath
                  in: query
                  description: |-
                    Optional JMESPath expression applied server-side to project or reduce the JSON response before it is returned (mirrors the MCP jmespath argument). Invalid expressions, expressions larger than 1024 UTF-8 bytes, or projections that exceed the 256 KB output cap return HTTP 400 with a {_jmespath_error, original_keys} envelope. Grammar and worked examples: https://www.worldmonitor.app/docs/mcp-jmespath.
                  required: false
                  example: "keys(@)"
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            example:
                                "aggregates":
                                    - "divisionFinal": "example"
                                      "divisionOriginal": "example"
                                      "eventCount": 1
                                      "eventYear": 1
                                      "id": "example-id"
                                "attribution": "example"
                                "degraded": true
                                "disclaimer": "example"
                                "fetchedAt": 1717200000000
                            schema:
                                $ref: '#/components/schemas/GetTorontoSafetyResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ValidationError'
                                    - $ref: '#/components/schemas/JmespathProjectionError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
components:
    schemas:
        JmespathProjectionError:
            description: Returned when a REST jmespath projection is invalid or exceeds the expression/output byte limits.
            properties:
                _jmespath_error:
                    description: Projection error discriminator and details.
                    type: string
                original_keys:
                    description: Top-level keys or shape of the unprojected response.
                    items:
                        type: string
                    type: array
            required:
                - _jmespath_error
                - original_keys
            type: object
        Error:
            type: object
            properties:
                message:
                    type: string
                    description: Error message (e.g., 'user not found', 'database connection failed')
            description: Error is returned when a handler encounters an error. It contains a simple error message that the developer can customize.
        FieldViolation:
            type: object
            properties:
                field:
                    type: string
                    description: The field path that failed validation (e.g., 'user.email' for nested fields). For header validation, this will be the header name (e.g., 'X-API-Key')
                description:
                    type: string
                    description: Human-readable description of the validation violation (e.g., 'must be a valid email address', 'required field missing')
            required:
                - field
                - description
            description: FieldViolation describes a single validation error for a specific field.
        ValidationError:
            type: object
            properties:
                violations:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldViolation'
                    description: List of validation violations
            required:
                - violations
            description: ValidationError is returned when request validation fails. It contains a list of field violations describing what went wrong.
        GetTorontoSafetyRequest:
            type: object
            properties:
                dataset:
                    type: string
                    description: 'Dataset selector. Accepted values: reported_occurrence, annual_aggregate.'
                limit:
                    type: integer
                    format: int32
                    description: Maximum rows to return. The service defaults to 50 and caps this value at 100.
                division:
                    type: string
                    description: Optional case-insensitive police-division filter.
                neighbourhood:
                    type: string
                    description: Optional case-insensitive neighbourhood filter.
                offence:
                    type: string
                    description: Optional case-insensitive offence filter for tps_mci.
                year:
                    type: integer
                    format: int32
                    description: Optional event-year filter for tps_calls_attended.
        GetTorontoSafetyResponse:
            type: object
            properties:
                semantic:
                    type: string
                source:
                    type: string
                sourceLabel:
                    type: string
                attribution:
                    type: string
                disclaimer:
                    type: string
                sourceUrl:
                    type: string
                fetchedAt:
                    type: integer
                    format: int64
                    description: 'Warning: Values > 2^53 may lose precision in JavaScript'
                sourceEditedAt:
                    type: integer
                    format: int64
                    description: 'Warning: Values > 2^53 may lose precision in JavaScript'
                newestContentAt:
                    type: integer
                    format: int64
                    description: 'Warning: Values > 2^53 may lose precision in JavaScript'
                newestContentYear:
                    type: integer
                    format: int32
                degraded:
                    type: boolean
                unavailable:
                    type: boolean
                matched:
                    type: integer
                    format: int32
                truncated:
                    type: boolean
                occurrences:
                    type: array
                    items:
                        $ref: '#/components/schemas/TorontoReportedOccurrence'
                aggregates:
                    type: array
                    items:
                        $ref: '#/components/schemas/TorontoAnnualAggregate'
        TorontoReportedOccurrence:
            type: object
            properties:
                id:
                    type: string
                objectId:
                    type: integer
                    format: int64
                    description: 'Warning: Values > 2^53 may lose precision in JavaScript'
                eventUniqueId:
                    type: string
                reportDate:
                    type: string
                occurrenceDate:
                    type: string
                division:
                    type: string
                locationType:
                    type: string
                premisesType:
                    type: string
                offence:
                    type: string
                csiCategory:
                    type: string
                neighbourhood:
                    type: string
                longitude:
                    type: number
                    format: double
                latitude:
                    type: number
                    format: double
                approximate:
                    type: boolean
        TorontoAnnualAggregate:
            type: object
            properties:
                id:
                    type: string
                objectId:
                    type: integer
                    format: int64
                    description: 'Warning: Values > 2^53 may lose precision in JavaScript'
                eventYear:
                    type: integer
                    format: int32
                divisionOriginal:
                    type: string
                divisionFinal:
                    type: string
                neighbourhood:
                    type: string
                eventCount:
                    type: number
                    format: double
                incidentPoint:
                    type: boolean
