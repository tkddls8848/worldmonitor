openapi: 3.1.0
info:
    title: WebcamService API
    version: 1.0.0
servers:
    - url: https://api.worldmonitor.app
paths:
    /api/webcam/v1/list-webcams:
        get:
            tags:
                - WebcamService
            summary: ListWebcams
            description: ListWebcams returns Windy webcams in a bounding box rounded out to whole degrees, from a seeded geo index capped at 2,000 per search, clustered below zoom 9.
            operationId: ListWebcams
            parameters:
                - name: zoom
                  in: query
                  description: Map zoom level used to decide whether to return webcams or clusters.
                  required: false
                  example: 1
                  schema:
                    type: integer
                    format: int32
                - name: bound_w
                  in: query
                  description: Western longitude bound of the map viewport.
                  required: false
                  example: 1.5
                  schema:
                    type: number
                    format: double
                - name: bound_s
                  in: query
                  description: Southern latitude bound of the map viewport.
                  required: false
                  example: 1.5
                  schema:
                    type: number
                    format: double
                - name: bound_e
                  in: query
                  description: Eastern longitude bound of the map viewport.
                  required: false
                  example: 1.5
                  schema:
                    type: number
                    format: double
                - name: bound_n
                  in: query
                  description: Northern latitude bound of the map viewport.
                  required: false
                  example: 1.5
                  schema:
                    type: number
                    format: double
                - name: jmespath
                  in: query
                  description: |-
                    Optional JMESPath expression applied server-side to project or reduce the JSON response before it is returned (mirrors the MCP jmespath argument). Invalid expressions, expressions larger than 1024 UTF-8 bytes, or projections that exceed the 256 KB output cap return HTTP 400 with a {_jmespath_error, original_keys} envelope. Grammar and worked examples: https://www.worldmonitor.app/docs/mcp-jmespath.
                  required: false
                  example: "keys(@)"
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            example:
                                "clusters":
                                    - "categories":
                                        - "example"
                                      "count": 1
                                      "lat": 40.7128
                                      "lng": -74.006
                                "totalInView": 1
                                "webcams":
                                    - "category": "cs.AI"
                                      "country": "US"
                                      "lat": 40.7128
                                      "lng": -74.006
                                      "title": "example"
                            schema:
                                $ref: '#/components/schemas/ListWebcamsResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ValidationError'
                                    - $ref: '#/components/schemas/JmespathProjectionError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/webcam/v1/get-webcam-image:
        get:
            tags:
                - WebcamService
            summary: GetWebcamImage
            description: GetWebcamImage resolves one Windy webcam id into thumbnail, player and Windy page URLs, title, media type and last image update, cached for five minutes.
            operationId: GetWebcamImage
            parameters:
                - name: webcam_id
                  in: query
                  description: Webcam identifier to resolve into image and player URLs.
                  required: false
                  example: "example-id"
                  schema:
                    type: string
                - name: jmespath
                  in: query
                  description: |-
                    Optional JMESPath expression applied server-side to project or reduce the JSON response before it is returned (mirrors the MCP jmespath argument). Invalid expressions, expressions larger than 1024 UTF-8 bytes, or projections that exceed the 256 KB output cap return HTTP 400 with a {_jmespath_error, original_keys} envelope. Grammar and worked examples: https://www.worldmonitor.app/docs/mcp-jmespath.
                  required: false
                  example: "keys(@)"
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            example:
                                "error": ""
                                "lastUpdated": "2026-01-15T12:00:00.000Z"
                                "mediaType": "snapshot"
                                "playerUrl": ""
                                "resolvedAt": 1768478460000
                                "thumbnailUrl": "https://example.com/cam.jpg"
                                "title": "Port camera"
                                "windyUrl": "https://www.windy.com/webcams/123"
                            schema:
                                $ref: '#/components/schemas/GetWebcamImageResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ValidationError'
                                    - $ref: '#/components/schemas/JmespathProjectionError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
components:
    schemas:
        JmespathProjectionError:
            description: Returned when a REST jmespath projection is invalid or exceeds the expression/output byte limits.
            properties:
                _jmespath_error:
                    description: Projection error discriminator and details.
                    type: string
                original_keys:
                    description: Top-level keys or shape of the unprojected response.
                    items:
                        type: string
                    type: array
            required:
                - _jmespath_error
                - original_keys
            type: object
        Error:
            type: object
            properties:
                message:
                    type: string
                    description: Error message (e.g., 'user not found', 'database connection failed')
            description: Error is returned when a handler encounters an error. It contains a simple error message that the developer can customize.
        FieldViolation:
            type: object
            properties:
                field:
                    type: string
                    description: The field path that failed validation (e.g., 'user.email' for nested fields). For header validation, this will be the header name (e.g., 'X-API-Key')
                description:
                    type: string
                    description: Human-readable description of the validation violation (e.g., 'must be a valid email address', 'required field missing')
            required:
                - field
                - description
            description: FieldViolation describes a single validation error for a specific field.
        ValidationError:
            type: object
            properties:
                violations:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldViolation'
                    description: List of validation violations
            required:
                - violations
            description: ValidationError is returned when request validation fails. It contains a list of field violations describing what went wrong.
        ListWebcamsRequest:
            type: object
            properties:
                zoom:
                    type: integer
                    format: int32
                    description: Map zoom level used to decide whether to return webcams or clusters.
                boundW:
                    type: number
                    format: double
                    description: Western longitude bound of the map viewport.
                boundS:
                    type: number
                    format: double
                    description: Southern latitude bound of the map viewport.
                boundE:
                    type: number
                    format: double
                    description: Eastern longitude bound of the map viewport.
                boundN:
                    type: number
                    format: double
                    description: Northern latitude bound of the map viewport.
        ListWebcamsResponse:
            type: object
            properties:
                webcams:
                    type: array
                    items:
                        $ref: '#/components/schemas/WebcamEntry'
                clusters:
                    type: array
                    items:
                        $ref: '#/components/schemas/WebcamCluster'
                totalInView:
                    type: integer
                    format: int32
        WebcamEntry:
            type: object
            properties:
                webcamId:
                    type: string
                title:
                    type: string
                lat:
                    type: number
                    format: double
                lng:
                    type: number
                    format: double
                category:
                    type: string
                country:
                    type: string
        WebcamCluster:
            type: object
            properties:
                lat:
                    type: number
                    format: double
                lng:
                    type: number
                    format: double
                count:
                    type: integer
                    format: int32
                categories:
                    type: array
                    items:
                        type: string
        GetWebcamImageRequest:
            type: object
            properties:
                webcamId:
                    type: string
                    description: Webcam identifier to resolve into image and player URLs.
        GetWebcamImageResponse:
            type: object
            properties:
                thumbnailUrl:
                    type: string
                playerUrl:
                    type: string
                title:
                    type: string
                windyUrl:
                    type: string
                lastUpdated:
                    type: string
                    description: Latest image update as an ISO-8601 string; empty if unknown or unavailable.
                error:
                    type: string
                resolvedAt:
                    type: integer
                    format: int64
                    description: 'URL resolution time in Unix milliseconds, not image capture time.. Warning: Values > 2^53 may lose precision in JavaScript'
                mediaType:
                    type: string
                    description: snapshot, timelapse or live. A live URL does not confirm the camera is online.
